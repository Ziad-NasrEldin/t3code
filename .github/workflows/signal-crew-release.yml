name: Signal Crew release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Signal Crew release channel"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: "Full release version (for example 0.1.9-nightly.20261104.1 or 0.1.9)"
        required: true
        type: string
      upstream_tag:
        description: "Official T3 Code nightly tag merged into this build (required for nightly)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: signal-crew-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Ziad-NasrEldin/t3code' && github.ref == 'refs/heads/feat/signal-crew-office'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      T3CODE_DESKTOP_EDITION: signal-crew
      T3CODE_DESKTOP_UPDATE_REPOSITORY: Ziad-NasrEldin/t3code
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      T3CODE_UPSTREAM_NIGHTLY_TAG: ${{ inputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release and signing configuration
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ "$CHANNEL" == nightly ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]] || { echo 'Nightly versions must match x.y.z-nightly.YYYYMMDD.N' >&2; exit 1; }
            test -n "$UPSTREAM_TAG" || { echo 'Nightly releases require the merged official nightly tag.' >&2; exit 1; }
          else
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable versions must match x.y.z' >&2; exit 1; }
          fi
          if [[ "$CHANNEL" == nightly ]]; then
            git fetch https://github.com/pingdotgg/t3code.git "refs/tags/$UPSTREAM_TAG"
            upstream=$(git rev-parse 'FETCH_HEAD^{commit}')
            git merge-base --is-ancestor "$upstream" "$GITHUB_SHA" || {
              echo "The maintained branch does not contain official nightly $UPSTREAM_TAG ($upstream). Merge it before releasing." >&2
              exit 1
            }
          fi
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER PROFILE TEAM; do
            test -n "${!key}" || { echo "Missing $key" >&2; exit 1; }
          done
        shell: bash
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Test updater and Office behavior
        run: env -u T3CODE_DESKTOP_EDITION vp test run apps/desktop/src/updates/DesktopUpdates.test.ts packages/client-runtime/src/state/office.test.ts scripts/build-desktop-artifact.test.ts
      - name: Build signed application
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/signalcrew.provisionprofile"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          printf '%s' "$PROFILE" | base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env
          node --env-file=.env scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 --build-version "$VERSION" --signed
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == nightly ]]; then
            manifest=release/nightly-mac.yml
          else
            manifest=release/latest-mac.yml
          fi
          test -f "$manifest"
          release_args=("v$VERSION" release/*.dmg release/*.zip release/*.blockmap "$manifest" --draft --target "$GITHUB_SHA")
          if [[ "$CHANNEL" == nightly ]]; then
            release_args+=(--prerelease)
            title="Signal Crew nightly $VERSION"
            notes="Signal Crew nightly built from official T3 Code nightly $UPSTREAM_TAG after the approved merge. Validate this installer and upgrade before publishing."
          else
            title="Signal Crew $VERSION"
            notes='Signal Crew for Apple Silicon. Validate this installer and upgrade before publishing.'
          fi
          gh release create "${release_args[@]}" --title "$title" --notes "$notes"
