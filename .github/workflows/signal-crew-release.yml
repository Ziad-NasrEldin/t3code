name: Signal Crew release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Monotonically increasing stable semver (for example 0.1.8)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: signal-crew-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Ziad-NasrEldin/t3code' && github.ref == 'refs/heads/feat/signal-crew-office'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      T3CODE_DESKTOP_EDITION: signal-crew
      T3CODE_DESKTOP_UPDATE_REPOSITORY: Ziad-NasrEldin/t3code
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release and signing configuration
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER PROFILE TEAM; do
            test -n "${!key}" || { echo "Missing $key" >&2; exit 1; }
          done
        shell: bash
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Test updater and Office behavior
        run: env -u T3CODE_DESKTOP_EDITION vp test run apps/desktop/src/updates/DesktopUpdates.test.ts packages/client-runtime/src/state/office.test.ts scripts/build-desktop-artifact.test.ts
      - name: Build signed application
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$RUNNER_TEMP/signalcrew.provisionprofile"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          printf '%s' "$PROFILE" | base64 -D > "$T3CODE_MACOS_PROVISIONING_PROFILE"
          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env
          node --env-file=.env scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 --build-version "$VERSION" --signed
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f release/latest-mac.yml
          gh release create "v$VERSION" release/*.dmg release/*.zip release/*.yml --draft --target "$GITHUB_SHA" --title "Signal Crew $VERSION" --notes 'Signal Crew for Apple Silicon. Validate this installer and upgrade before publishing.'
