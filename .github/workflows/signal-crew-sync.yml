name: Signal Crew nightly upstream check
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signal-crew-sync
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Ziad-NasrEldin/t3code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/signal-crew-office
          fetch-depth: 0
      - name: Resolve latest official nightly
        id: nightly
        uses: actions/github-script@v8
        with:
          script: |
            const { resolveLatestNightlyCommit } = require('./.github/scripts/check-nightly-release.cjs');
            const { tag, sha } = await resolveLatestNightlyCommit({
              github,
              context: { repo: { owner: 'pingdotgg', repo: 't3code' } },
              core,
            });
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
      - name: Prepare an upstream merge for review
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.nightly.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.nightly.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$UPSTREAM_TAG"
          git fetch https://github.com/pingdotgg/t3code.git "refs/tags/$tag"
          upstream=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$upstream" = "$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$upstream" HEAD; then exit 0; fi
          branch="signal-crew/upstream-$upstream"
          if git ls-remote --exit-code --heads origin "$branch"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          if ! git merge --no-edit "$upstream"; then
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo 'Upstream merge requires manual repair.' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
          echo "Prepared $branch from official nightly $tag. Review and test before merging." >> "$GITHUB_STEP_SUMMARY"
